<!doctype html>
<html
	lang="en"
	prefix="og: https://ogp.me/ns# article: https://ogp.me/ns/article# profile: https://ogp.me/ns/profile#"
>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f4efe6" />
		<script>
			(() => {
				const root = document.documentElement;
				let preference = 'system';

				try {
					preference = localStorage.getItem('theme') ?? 'system';
				} catch {
					// Storage may be unavailable; the system preference remains a safe fallback.
				}

				const theme =
					preference === 'light' || preference === 'dark'
						? preference
						: matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';

				root.dataset.theme = theme;
				root.style.colorScheme = theme;
				document
					.querySelector('meta[name="theme-color"]')
					?.setAttribute('content', theme === 'dark' ? '#211c18' : '#f4efe6');
			})();
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Person",
				"name": "Petr Ivan",
				"url": "https://petrivan.com/",
				"image": "https://petrivan.com/petr-ivan-portrait.jpg",
				"jobTitle": "Machine learning engineer",
				"alumniOf": {
					"@type": "EducationalOrganization",
					"name": "Student Trainee Center"
				},
				"memberOf": {
					"@type": "CollegeOrUniversity",
					"name": "Delft University of Technology"
				},
				"sameAs": ["https://github.com/PetrIvan", "https://www.linkedin.com/in/petr-ivan"]
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
