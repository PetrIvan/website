version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Budapest
    rebase-strategy: disabled
    versioning-strategy: increase-if-necessary
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Keep runtime types aligned with the Node.js version in package.json.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # This retired plugin needs a deliberate migration rather than a blind major bump.
      - dependency-name: remark-footnotes
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Budapest
    rebase-strategy: disabled
    groups:
      actions:
        patterns:
          - '*'
